plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id("org.barfuin.gradle.jacocolog") version "3.1.0"
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation 'com.sparkjava:spark-core:2.9.3'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.8.9'
    implementation group: 'org.json', name: 'json', version: '20230618'
    implementation group: 'org.reflections', name: 'reflections', version: '0.10.2'
    implementation 'org.slf4j:slf4j-simple:1.7.36'

    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
        }
        resources {
           srcDir 'src/main/resources'
        }
    }
   test {
        java {
           srcDir 'src/test'
        }
    }
}

def frontendDirectory = rootProject.projectDir
def npmExecutable = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('installFrontend', Exec) {
    workingDir frontendDirectory
    commandLine npmExecutable, 'ci', '--no-audit', '--no-fund'
    inputs.files(rootProject.file('package.json'), rootProject.file('package-lock.json'))
    outputs.file(rootProject.file('node_modules/.package-lock.json'))
}

tasks.register('buildFrontend', Exec) {
    dependsOn 'installFrontend'
    workingDir frontendDirectory
    commandLine npmExecutable, 'run', 'build'
    inputs.files(fileTree('src/main/resources/app') { include '*.js' })
    inputs.files(rootProject.file('package.json'), rootProject.file('package-lock.json'))
    outputs.dir(layout.buildDirectory.dir('generated/frontend'))
}

processResources {
    dependsOn 'buildFrontend'
    duplicatesStrategy = 'include'
    from(layout.buildDirectory.dir('generated/frontend'))
    // Ship one browser bundle; the readable modules remain the source of truth.
    exclude 'app/mission-control.js', 'app/orbital-scene.js', 'app/simulation-api.js'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}


// Compile Java 17-compatible bytecode without forcing Gradle to provision an
// exact JDK. This keeps the build usable with JDK 17 and newer installations.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

checkstyle {
    configFile = file("${project.rootDir}/config/checkstyle.xml")
    toolVersion = '10.3.3'
}

task lint {
    description("Lints the entire codebase, runs both checkstyleMain and checkstyleTest")
    group("verification")
    dependsOn('checkstyleMain', 'checkstyleTest')
}

jacocoTestReport {
    reports {
        xml.required = true
        csv.required = false
    }

    afterEvaluate {
        classDirectories.from = files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**App**',
                'scintilla/**'
            ])
        })
    }

    dependsOn test // tests are required to run before generating the report
}

jacocoTestCoverageVerification {
    // violationRules {
    //     rule {
    //         limit {
    //             counter = "BRANCH"
    //             minimum = 0.80
    //         }
    //     }
    // }

    afterEvaluate {
        classDirectories.from = files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**App**',
                'scintilla/**'
            ])
        })
    }

    dependsOn jacocoTestReport
}

task coverage {
    description("Generate coverage report and check if above threshold if it exists")
    group("verification")
    dependsOn('jacocoTestCoverageVerification')
}

jacocoLogTestCoverage {
    logAlways = true
    counters {
        showClassCoverage = false
        showMethodCoverage = false
        showInstructionCoverage = false
        showComplexityCoverage = false
    }
}

application {
    mainClass = 'unsw.App'
}
