name: Blackout checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash ./gradlew --no-daemon test lint assemble jacocoTestReport :app:installDist
      - run: npx playwright install --with-deps chrome
      - name: Real simulation browser check
        run: |
          env 'scintilla:PORT=4577' 'scintilla:HEADLESS=1' bash app/build/install/app/bin/app > /tmp/blackout.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4577/app/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/blackout.log; exit 1; fi
          npm run test:browser
        env:
          BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blackout-browser-evidence
          path: docs/screenshots/
